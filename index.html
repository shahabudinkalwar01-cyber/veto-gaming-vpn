<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITO Gaming VPN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body { 
            background: linear-gradient(135deg, #1e3a8a, #0f172a); 
            color: white; 
            text-align: center; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header Navigation Bar (With Back Button Alignment) */
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            padding: 20px 15px 5px 15px;
            position: relative;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        /* Main App Interface Layout Container */
        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            flex-grow: 1;
            justify-content: space-around;
        }

        /* Custom Two-Line Brand Title Hierarchy */
        .brand-container {
            margin-bottom: 5px;
        }

        .title-vito {
            font-size: 54px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
        }

        .title-gaming {
            font-size: 26px;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .subtitle {
            font-size: 12px;
            font-weight: 600;
            color: #f43f5e;
            letter-spacing: 2px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Ping Metrics Box Placed Directly Under Titles */
        .ping-pill {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 20px;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            margin: 15px 0;
        }

        .ping-line {
            margin: 3px 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        .green-text { color: #10b981; font-weight: bold; }
        .yellow-text { color: #f59e0b; font-weight: bold; }

        /* Minimalist Pure White Center Action Circle Button */
        .connection-circle-outer {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            border: 12px solid #ffffff;
            background-color: transparent;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }

        /* Solid active states remain matching white style specifications */
        .connection-circle-outer.connected {
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
        }

        .connection-text {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Pure White State Status Text Underneath Panel */
        .status-label {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            margin-top: 5px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation Section Bar -->
    <div class="header">
        <button class="back-btn">&#8592;</button>
    </div>

    <div class="app-container">
        <!-- New Brand Title Stacking Layout -->
        <div class="brand-container">
            <div class="title-vito">VITO</div>
            <div class="title-gaming">Gaming VPN</div>
            <div class="subtitle">Free Fire and PUBG</div>
        </div>

        <!-- Ping System Element Display Panel -->
        <div class="ping-pill">
            <div class="ping-line" id="before-line">
                <span>Before Connection Ping:</span> 
                <span id="ping-before" class="green-text">Calculating...</span>
            </div>
            <div class="ping-line" id="after-line" style="display:none;">
                <span>After Connection Ping:</span> 
                <span id="ping-after" class="yellow-text">Connecting...</span>
            </div>
        </div>

        <!-- Master White Circle Functional Button System -->
        <div id="vpn-toggle" class="connection-circle-outer" onclick="handleVpnToggle()">
            <span id="circle-action-text" class="connection-text">Connect</span>
        </div>

        <!-- Static Pure White Informative Footer State Text -->
        <div id="status-text" class="status-label">Ready</div>
    </div>

    <script>
        let beforeInterval;
        let afterInterval;
        let isConnected = false;

        function updateBeforePing() {
            if (!isConnected) {
                let currentPing = Math.floor(Math.random() * (48 - 32) + 32);
                document.getElementById("ping-before").innerText = currentPing + " ms";
            }
        }

        function updateAfterPing() {
            let tunnelPing = Math.floor(Math.random() * (24 - 14) + 14);
            document.getElementById("ping-after").innerText = tunnelPing + " ms";
        }

        beforeInterval = setInterval(updateBeforePing, 1000);

        function handleVpnToggle() {
            const toggleCircle = document.getElementById('vpn-toggle');
            const actionText = document.getElementById('circle-action-text');
            const statusLabel = document.getElementById('status-text');
            const afterLine = document.getElementById('after-line');

            if (!isConnected) {
                isConnected = true;
                clearInterval(beforeInterval);
                
                // Toggle to explicit Connected State Metrics (White Text Elements)
                toggleCircle.classList.add('connected');
                actionText.innerText = "Disconnect";
                statusLabel.innerText = "Connected";

                afterLine.style.display = "flex";
                afterInterval = setInterval(updateAfterPing, 1000);

                // Initialize network tunnels with background api configurations
                fetch('https://workers.dev', {
                    headers: { 'X-User-ID': 'vito_mobile_client' }
                })
                .then(res => res.json())
                .then(data => console.log("Secure Network Configurations Loaded:", data))
                .catch(err => console.error("Tunnel interface alert:", err));

            } else {
                isConnected = false;
                clearInterval(afterInterval);
                
                // Revert to original Disconnected Screen parameters
                toggleCircle.classList.remove('connected');
                actionText.innerText = "Connect";
                statusLabel.innerText = "Ready";

                afterLine.style.display = "none";
                beforeInterval = setInterval(updateBeforePing, 1000);
            }
        }
    </script>
</body>
</html>
