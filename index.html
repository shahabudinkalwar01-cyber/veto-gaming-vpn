<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITO Gaming VPN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }
        /* Top Navigation Header Area */
        .app-header {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            background: transparent;
            gap: 25px; /* Spacing between the buttons */
            z-index: 10;
        }
        /* Left Custom Burger Menu Configuration Button */
        .burger-menu {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 18px;
            cursor: pointer;
        }
        .burger-line {
            height: 3px;
            width: 100%;
            background-color: #000000; /* Pure black as specified */
            border-radius: 2px;
        }
        /* Left Custom Share Icon Button */
        .share-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .share-icon-svg {
            width: 24px;
            height: 24px;
            fill: #000000; /* Pure black as specified */
        }
        /* Slide-out Side Drawer Panels Navigation */
        .side-drawer {
            position: fixed;
            top: 0;
            left: -280px; /* Hidden offscreen initially */
            width: 280px;
            height: 100%;
            background-color: #0f172a;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
            z-index: 100;
            transition: left 0.3s ease-in-out;
            text-align: left;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }
        .side-drawer.open {
            left: 0;
        }
        .drawer-header {
            font-size: 24px;
            font-weight: 800;
            color: #f59e0b;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .drawer-item {
            padding: 15px 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: background 0.2s ease;
        }
        .drawer-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        /* Dark Translucent Panel Overlay Screen */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            z-index: 99;
            display: none;
        }
        /* Main Layout Content Container */
        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            flex-grow: 1;
            justify-content: space-around;
        }
        /* Custom Two-Line Brand Title Hierarchy */
        .brand-container {
            margin-bottom: 5px;
        }
        .title-vito {
            font-size: 54px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
        }
        .title-gaming {
            font-size: 26px;
            font-weight: 700;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }
        .subtitle {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 2px;
            margin-top: 5px;
            text-transform: uppercase;
            opacity: 0.9;
        }
        /* Ping Metrics Box Panel */
        .ping-pill {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 24px;
            padding: 18px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            margin: 15px 0;
        }
        .ping-line {
            margin: 6px 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .green-text {
            color: #10b981;
            font-weight: bold;
        }
        .yellow-text {
            color: #a7f3d0;
            font-weight: bold;
        }
        /* Master Center Action Circle Button Component */
        .connection-circle-outer {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            border: 12px solid #ffffff;
            background-color: transparent;
            box-shadow: 0 4px 25px rgba(255, 255, 255, 0.2);
            margin: 20px 0;
        }
        .connection-circle-outer.connected {
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.45);
        }
        .connection-text {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }
        /* Pure White Lower Footer Status Text */
        .status-label {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            margin-top: 5px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <!-- Overlay backdrop layer -->
    <div id="drawerOverlay" class="drawer-overlay" onclick="toggleDrawer()"></div>

    <!-- Sliding Sidebar Menu Drawer -->
    <div id="sideDrawer" class="side-drawer">
        <div class="drawer-header">VITO SETTINGS</div>
        <div class="drawer-item" onclick="toggleDrawer()">🚀 Optimize Ping</div>
        <div class="drawer-item" onclick="toggleDrawer()">🌍 Change Server</div>
        <div class="drawer-item" onclick="shareApp()">🔗 Share with Friends</div>
        <div class="drawer-item" onclick="toggleDrawer()" style="margin-top: auto; color: #f43f5e;">❌ Close</div>
    </div>

    <!-- Application Top Bar Layout Row -->
    <div class="app-header">
        <!-- 3 Lines Burger Button -->
        <div class="burger-menu" onclick="toggleDrawer()">
            <div class="burger-line"></div>
            <div class="burger-line"></div>
            <div class="burger-line"></div>
        </div>
        
        <!-- Native Style Share System Button -->
        <button class="share-btn" onclick="shareApp()" aria-label="Share App">
            <svg class="share-icon-svg" viewBox="0 0 24 24">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
            </svg>
        </button>
    </div>

    <!-- App Main Dashboard Container -->
    <div class="app-container">
        <div class="brand-container">
            <div class="title-vito">VITO</div>
            <div class="title-gaming">Gaming VPN</div>
            <div class="subtitle">Free Fire and PUBG</div>
        </div>

        <!-- Ping Real-time Panel -->
        <div class="ping-pill">
            <div class="ping-line" id="before-line">
                <span>Before Connection Ping:</span>
                <span id="ping-before" class="green-text">Calculating...</span>
            </div>
            <div class="ping-line" id="after-line">
                <span>After Connection Ping:</span>
                <span id="ping-after" class="yellow-text">--</span>
            </div>
        </div>

        <!-- Connection Button Switch -->
        <div id="vpn-toggle" class="connection-circle-outer" onclick="handleVpnToggle()">
            <span id="circle-action-text" class="connection-text">Connect</span>
        </div>

        <div id="status-text" class="status-label">Ready</div>
    </div>

    <script>
        let beforeInterval;
        let afterInterval;
        let isConnected = false;

        // Custom Slide-out Side Drawer Display Handler logic
        function toggleDrawer() {
            const drawer = document.getElementById('sideDrawer');
            const overlay = document.getElementById('drawerOverlay');
            if(drawer.classList.contains('open')) {
                drawer.classList.remove('open');
                overlay.style.display = 'none';
