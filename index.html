<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITO Gaming VPN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            flex-grow: 1;
            justify-content: space-around;
        }
        .brand-container {
            margin-bottom: 5px;
        }
        .title-vito {
            font-size: 54px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
        }
        .title-gaming {
            font-size: 26px;
            font-weight: 700;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }
        .subtitle {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 2px;
            margin-top: 5px;
            text-transform: uppercase;
            opacity: 0.9;
        }
        .ping-pill {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 24px;
            padding: 18px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            margin: 15px 0;
        }
        .ping-line {
            margin: 6px 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .green-text {
            color: #10b981;
            font-weight: bold;
        }
        .yellow-text {
            color: #a7f3d0;
            font-weight: bold;
        }
        .connection-circle-outer {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            border: 12px solid #ffffff;
            background-color: transparent;
            box-shadow: 0 4px 25px rgba(255, 255, 255, 0.2);
            margin: 20px 0;
        }
        .connection-circle-outer:active {
            transform: scale(0.96);
            background-color: rgba(255, 255, 255, 0.1);
        }
        .connection-circle-outer.connected {
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.45);
        }
        .connection-text {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            pointer-events: none; /* Prevents text from blocking touches */
        }
        .status-label {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            margin-top: 5px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="brand-container">
            <div class="title-vito">VITO</div>
            <div class="title-gaming">Gaming VPN</div>
            <div class="subtitle">Free Fire and PUBG</div>
        </div>

        <div class="ping-pill">
            <div class="ping-line">
                <span>Before Connection Ping:</span>
                <span id="ping-before" class="green-text">38 ms</span>
            </div>
            <div class="ping-line">
                <span>After Connection Ping:</span>
                <span id="ping-after" class="yellow-text">--</span>
            </div>
        </div>

        <!-- Heavy duty container touch target -->
        <div id="vpn-toggle" class="connection-circle-outer" role="button">
            <span id="circle-action-text" class="connection-text">Connect</span>
        </div>

        <div id="status-text" class="status-label">Ready</div>
    </div>

    <script>
        let beforeInterval;
        let afterInterval;
        let isConnected = false;

        function updateBeforePing() {
            if (!isConnected) {
                let currentPing = Math.floor(Math.random() * (46 - 34) + 34);
                document.getElementById("ping-before").innerText = currentPing + " ms";
            }
        }

        function updateAfterPing() {
            if (isConnected) {
                let tunnelPing = Math.floor(Math.random() * (22 - 14) + 14);
                document.getElementById("ping-after").innerText = tunnelPing + " ms";
            }
        }

        // Dedicated event listener setup to bypass Webview touch freezes
        document.getElementById('vpn-toggle').addEventListener('click', function(e) {
            e.preventDefault();
            
            const toggleCircle = document.getElementById('vpn-toggle');
            const actionText = document.getElementById('circle-action-text');
            const statusLabel = document.getElementById('status-text');
            const pingAfter = document.getElementById('ping-after');

            if (!isConnected) {
                isConnected = true;
                toggleCircle.classList.add('connected');
                actionText.innerText = "Disconnect";
                statusLabel.innerText = "Connected";
                pingAfter.innerText = "Connecting...";
                
                clearInterval(beforeInterval);
                afterInterval = setInterval(updateAfterPing, 1000);
            } else {
                isConnected = false;
                toggleCircle.classList.remove('connected');
                actionText.innerText = "Connect";
                statusLabel.innerText = "Ready";
                pingAfter.innerText = "--";
                
                clearInterval(afterInterval);
                beforeInterval = setInterval(updateBeforePing, 1000);
            }
        });

        // Initialize simulation loop
        beforeInterval = setInterval(updateBeforePing, 1000);
    </script>
</body>
</html>
